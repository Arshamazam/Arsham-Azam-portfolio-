# Builds the site (and regenerates the CV PDF) on every push to main,
# then uploads only the changed files to Hostinger over FTP.
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#   FTP_SERVER      e.g. ftp.yourdomain.com   (hPanel → Files → FTP Accounts → "FTP IP / hostname")
#   FTP_USERNAME    e.g. u123456789           (same page)
#   FTP_PASSWORD    the FTP account password
#   FTP_SERVER_DIR  optional, defaults to public_html/   (must end with /)
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site and regenerate CV PDF
        run: npm run cv
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Check FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: ./out/
